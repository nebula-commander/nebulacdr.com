# nebulacommander.com. TLS and the http->https redirect are the reverse proxy's job.

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css text/plain text/xml application/xml application/rss+xml
           application/javascript application/json image/svg+xml;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name nebulacommander.com;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;

    error_page 404 /404.html;

    # Pages change with every deploy: always revalidate.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~* \.(css|js|png|jpe?g|gif|webp|svg|ico|woff2?|ttf)$ {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

# The other names send visitors to the same page on nebulacommander.com, so old links such
# as nebulacdr.com/docs/web-ui/move/ keep working.
server {
    listen 80;
    listen [::]:80;
    server_name nebulacdr.com www.nebulacdr.com www.nebulacommander.com;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://nebulacommander.com$request_uri;
    }
}
